<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSUMGI Console 初期設定</title>
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <header class="top">
    <h1>TSUMGI Console 初期設定</h1>
  </header>
  <main>
    <form id="setup-form" class="card" autocomplete="off">
      <p>パスワードがまだ設定されていません。Control のログ、または Control ホストの
        <code>admin-credentials.json.setup-code</code> にあるセットアップコードを入力して設定します。</p>
      <p class="muted">コードは設定が済むと無効になります。パスワードは 12 文字以上にしてください。</p>
      <p id="setup-error" class="banner error" role="alert" hidden></p>
      <label for="setup-code">セットアップコード</label>
      <input id="setup-code" type="text" spellcheck="false" autocomplete="off" required>
      <label for="setup-user">ユーザー名</label>
      <input id="setup-user" type="text" autocomplete="username" required maxlength="64">
      <label for="setup-pass">パスワード（12 文字以上）</label>
      <input id="setup-pass" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
      <label for="setup-pass2">パスワード（確認）</label>
      <input id="setup-pass2" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
      <p><button type="submit" id="setup-button">設定する</button></p>
    </form>
    <p id="setup-done" class="banner" role="status" hidden>
      設定しました。ログインを求められたら、いま決めたユーザー名とパスワードを入力してください。
    </p>
  </main>
  <script src="/admin/setup.js"></script>
</body>
</html>
