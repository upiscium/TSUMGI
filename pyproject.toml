[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tsumgi"
version = "0.3.0rc2"
description = "TSUMGI deployment-agnostic compute fabric for heterogeneous compute nodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
tsumgi-control = "tsumgi.control.daemon:main"
tsumgi-worker = "tsumgi.worker.daemon:main"
tsumgi-worker-mode = "tsumgi.worker.mode:main"
tsumgi-migrate = "tsumgi.control.migrate:main"
tsumgi-hardware-accept = "tsumgi.validation.hardware:main"
tsumgi-runtime-deployment-accept = "tsumgi.validation.runtime_deployment:main"
tsumgi-opencode-chat-accept = "tsumgi.validation.opencode_chat:main"
tsumgi-decision-shadow-accept = "tsumgi.validation.decision_shadow:main"
tsumgi-d1-gpu-smoke = "tsumgi.validation.d1_gpu_smoke:main"
tsumgi-embedding-accept = "tsumgi.validation.embedding:main"
tsumgi-coding-pilot = "tsumgi.validation.coding_pilot:main"
tsumgi-setup-tui = "tsumgi.setup.tui:main"
tsumgi-repin-decision = "tsumgi.setup.repin:main"
tsumgi-migrate-host = "tsumgi.setup.host_rename:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumgi"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tsumgi/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"