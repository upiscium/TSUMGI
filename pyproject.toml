[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astrumweaver"
version = "0.1.0rc1"
description = "TSUMGI deployment-agnostic compute fabric for heterogeneous compute nodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
astrumweaver-control = "astrumweaver.control.daemon:main"
astrumweaver-worker = "astrumweaver.worker.daemon:main"
astrumweaver-worker-mode = "astrumweaver.worker.mode:main"
astrumweaver-migrate = "astrumweaver.control.migrate:main"
astrumweaver-hardware-accept = "astrumweaver.validation.hardware:main"
astrumweaver-runtime-deployment-accept = "astrumweaver.validation.runtime_deployment:main"
astrumweaver-opencode-chat-accept = "astrumweaver.validation.opencode_chat:main"
astrumweaver-decision-shadow-accept = "astrumweaver.validation.decision_shadow:main"
astrumweaver-d1-gpu-smoke = "astrumweaver.validation.d1_gpu_smoke:main"
astrumweaver-embedding-accept = "astrumweaver.validation.embedding:main"
astrumweaver-coding-pilot = "astrumweaver.validation.coding_pilot:main"
astrumweaver-setup-tui = "astrumweaver.setup.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astrumweaver"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "astrumweaver/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"